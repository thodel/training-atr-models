# The same gate the serving repo runs, for the same reason (#57 over there):
# development lands as direct commits to `main`, so there is no review step and
# no PR check — the suite would only ever run where somebody remembered to run
# it. Three broken commits reached `main` in three days that way.
#
# It installs ONLY the orchestration dependencies. That is what makes the job
# fast and honest: the trainer service spawns its runners in per-engine venvs
# (torch, kraken, transformers), which exist precisely so those pins never enter
# this tree. If a test starts needing torch, that is a design regression worth
# failing on.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # asteraix ships 3.12.3 (measured 16.09.2026); CI matches the box
          # rather than the newest release, so a green run means something here.
          python-version: "3.12"
          cache: pip

      - name: Install orchestration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the test suite
        run: pytest -q

      - name: Lint
        run: ruff check .
