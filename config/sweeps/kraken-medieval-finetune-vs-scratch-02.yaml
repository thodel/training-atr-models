notes: |
  METRIC. Run this with --metric cer, like sweep 1 and for the same reason: both
  cells send the identical `datasets`, so they hit one artefact-cache entry and
  share one validation partition. `cer` is comparable between these two cells,
  and between them and sweep 1's cells, because the data version is the same —
  and with nothing else.

  The winner gets measured on german-medieval-v1 afterwards, the way 0.2131 was.

  NO NOISE FLOOR YET (#115). For a two-cell question this is less fatal than for
  a ranking, and the reason is worth stating rather than assuming: #118 expects a
  fitting base to beat from scratch by a margin, not by a hair. If the gap comes
  out large, it is readable without a floor. If it comes out small, it is not a
  result — it is a reason to measure the floor first.

  RESIZE. `union` rather than `fail`, because the base's codec will not contain
  every character of four German chancery corpora and `fail` would stop the run
  at exactly that discovery. It is inert for the from-scratch cell: `ketos_cmd`
  emits --resize only alongside --load.

  NOT PINNED, same as sweep 1 and the same command in its header: none of the
  four datasets names a `revision`, so this digest identifies the specs and not
  the bytes. Pin them on asteraix, where the Hub is reachable.
