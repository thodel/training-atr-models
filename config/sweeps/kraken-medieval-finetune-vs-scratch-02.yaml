# The second Kraken sweep (#118, part of #111): fine-tune or from scratch?
#
# Two cells. #118 lists "fine-tuning instead of from scratch" among the axes
# nobody has tried and says why it comes first:
#
#   "Ein Feintuning einer passenden Basis kann jede Architekturvariante von
#    Null schlagen, und dann ist der ganze Suchraum die falsche Frage."
#
# Which is why this runs before the rest of the height/augmentation ladder of
# sweep 1 is exhausted. If a fine-tune of a general medieval base beats the
# production baseline at this budget, the architecture search is not the
# programme; if it does not, sweep 1 continues knowing that.
#
# SAME DATA AS SWEEP 1. The `data` block is copied from
# kraken-medieval-height-augment-lrate-01.yaml, not retyped, so both sweeps hit
# one entry of the artefact cache and share one validation partition. That is
# what makes `cer` comparable at all — a test compares the two files and fails
# if either is changed alone.
#
# BOTH ARMS RUN HERE, including the from-scratch one, even though sweep 1 has a
# cell with the same hyperparameters. Two reasons, and the first is the rule
# sweep 1 wrote down for its own h64 control: a comparison across sweeps is
# what the noise-floor work forbids. The second is that `resize: union` is part
# of this configuration and not of sweep 1's, so the two scratch cells have
# different `config_id`s — correctly: `ketos` ignores --resize without --load,
# but a parameter that is set is part of what was run.
#
# WHY `spec` IS NOT AN AXIS HERE. `ketos train` ignores --spec when --load is
# given; the loaded network keeps its own geometry. A fine-tune cell labelled
# h192 would have trained at whatever height CATMuS has, and the leaderboard
# would carry a height column half its rows never used. `sweep_manifest`
# refuses the combination rather than letting it print.
#
# THE BASE, AND WHY THIS ONE
#
#   kraken-catmus_medieval -> 10.5281/zenodo.7516057, "CATMuS Medieval"
#
# Chosen on two grounds and one of them is negative:
#
#   * It is one of the fifteen kraken entries whose name and record AGREE.
#     #101 found 28 of 43 naming something their DOI does not contain, so for
#     most of the registry "the name says medieval German" is not evidence
#     about the weights. `scripts/audit_registry.py` classes this one `match`.
#   * CATMuS Medieval is built to be fine-tuned from — that is what it is for.
#
# What it is NOT is a script match: the registry records Caroline minuscule,
# 14th-16th c., and these four corpora are 15th-17th c. German chancery
# cursive and bastarda. `GET /bases` ranks by script before century (#44), so
# its own ranking would prefer one of the bastarda/cursive models — and those
# are exactly `kraken-medieval_generic_a/_c/_d`, whose ids #101 showed to be
# wrong about their own weights. Starting a published number from a model
# referenced through an id that is known to lie is the mistake #101 is about.
# So: this base, and the script mismatch is part of what the sweep measures —
# does a general medieval base help a German chancery corpus at all.
#
# WHAT HAS TO HAPPEN BEFORE A NUMBER FROM THIS IS PUBLISHED. A fine-tune
# inherits its base's training data, and the registry records no
# `training_datasets` for this entry, so nobody can say it has not seen the
# held-out documents (#100). Check it:
#
#   scripts/check_sweep.py config/sweeps/kraken-medieval-finetune-vs-scratch-02.yaml \
#       --registry config/models.yaml
#
# It will say `unrecorded`, which is the honest answer and not a clean one.
# Resolving the DOI and writing what CATMuS Medieval was trained on into the
# registry is the step that turns it into one.

