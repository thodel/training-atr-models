# The first VLM sweep (#138, the last open part of #12).
#
# ONE AXIS, THREE CELLS. #138 asks for batch size and learning rate as one axis
# and says why: linear scaling ties them, so varying them separately ranks
# compute time rather than learning — a larger batch at an unchanged rate simply
# takes fewer steps over the same data. `effective_batch` below is therefore a
# coupled axis (692f632): one value carries all three parameters.
#
# WHY `accumulate_grad_batches` MOVES AND `batch_size` DOES NOT. They multiply to
# the effective batch, and `convergence.epochs_for` reads the product — but they
# cost differently. Raising `batch_size` multiplies activation memory; raising
# the accumulation does not. A sweep about learning dynamics must not confound
# the two, so memory is held constant here and only the effective batch moves.
# What `batch_size` should be is a VRAM question and was answered separately
# (#137): bf16 on one A40 peaked at 27,763 of 45,486 MiB at batch 1 on page
# samples, and these are line samples at an eighth of the tokens.
#
# WHAT IS DELIBERATELY ABSENT
#
#   batch_size        — see above: a memory axis masquerading as a learning one.
#   max_seq_len       — measured and settled: 4096 fits the corpus and not its
#                       tail, and raising it moves a warning threshold rather
#                       than allocating anything (#138, 422d9f7). The line
#                       budget of 512 is what applies here.
#   load_in_4bit      — #137 measured bf16 as 22 % FASTER and fitting on one
#                       card, so `false` is the setting, not a question. It is
#                       in `base`, not on an axis.
#   lora_r            — a real question and a smaller one than the effective
#                       batch. Fixed at the 64 every run here has used.
#   seed              — a sweep that varies the seed measures seed noise.
#                       Varying it is what the noise floor does, on one
#                       configuration, on purpose.
#
# PINNED AND RUNNABLE SINCE 12.10.2026. The four `revision`s and the digest were
# filled from asteraix once it was reachable again; `key_for_specs(..., "vllm")`
# reports `pinned: True`. Why that mattered enough to leave the file refusing
# until then:
#
#   * the revisions make the artefact PINNED. An unpinned artefact expires after
#     seven days (artefact_cache.UNPINNED_MAX_AGE_DAYS) and a three-rung ladder
#     runs longer — rung 1 would then be compared against a validation partition
#     rebuilt between the rungs. This is not hypothetical: the artefact these
#     corpora were last measured on expired between 03.10. and 12.10.2026 and
#     took the sample set with it.
#   * the digest identifies the bytes rather than a description of them, and it
#     CHANGES when the revisions go in — so it has to be computed after them and
#     before the first run, never after.
#
# Reproduce both with, on asteraix:
#
#   for r in dh-unibe/image-text_zh-regierungsratsprotokolle \
#            dh-unibe/image-text_kurrent-xix \
#            dh-unibe/image-text_parlamentsdienste-protokolle \
#            dh-unibe/image-text_nr-sr-vereinigte-bundesversammlung-xix; do
#     .venvs/kraken-train/bin/python -c \
#       "import sys;from huggingface_hub import HfApi;print(sys.argv[1], HfApi().dataset_info(sys.argv[1]).sha)" "$r"
#   done
#
# and then, with the revisions written in above:
#
#   .venvs/kraken-train/bin/python -c "import yaml,sys;sys.path.insert(0,'src');\
#   from atr_training.contracts import DatasetSpec;\
#   from atr_training.artefact_cache import key_for_specs;\
#   d=yaml.safe_load(open('config/sweeps/vlm-xix-effective-batch-01.yaml'))['data']['datasets'];\
#   print(key_for_specs([DatasetSpec.model_validate(x) for x in d],'vllm').digest)"

