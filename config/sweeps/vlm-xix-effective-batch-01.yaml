budget:
  # `qwen3vl-german-xix-v2` trained one epoch over 405k lines at effective batch
  # 16, which is ~25,000 optimizer steps. A screening rung at 3,000 is an eighth
  # of that: enough to separate three learning rates, far too little to call a
  # model trained — which is what a rung 0 is for.
  #
  # The engine takes this as `max_steps` (#138, 12.10.2026). It has to: the only
  # budget it took before was epochs, and `epochs_for(3000, 405k, 16)` rounds up
  # to the smallest epoch count — one, which is ~25,000 steps. Every "3,000-step"
  # cell would have trained a whole epoch, rung 1 would have equalled rung 0,
  # and nothing would have said so. Found one check before the first run.
  steps: 3000
  rungs: [3, 1]
  # 3x3,000 + 1x9,000 = 18,000, plus room for one preempted cell.
  max_total_steps: 22000

base:
  granularity: line
  load_in_4bit: false
  batch_size: 16
  accumulate_grad_batches: 1
  lrate: 2.0e-4
  lora_r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  gradient_checkpointing: true
  seed: 42
  workers: 4
  device: cuda:0

axes:
  # The coupled axis. Cell one IS `qwen3vl-german-xix-v2`'s setting, so the
  # baseline is measured here, at this budget, on this corpus — without it
  # "better" would be a comparison across sweeps, which the noise floor forbids.
  effective_batch:
    - {batch_size: 16, accumulate_grad_batches: 1, lrate: 2.0e-4}
    - {batch_size: 16, accumulate_grad_batches: 2, lrate: 4.0e-4}
    - {batch_size: 16, accumulate_grad_batches: 4, lrate: 8.0e-4}

baseline:
  # The number to beat, and the two fields that keep the leaderboard from
  # comparing across sets. 0.0533 is v2's own validation split at ~25,000 steps;
  # this sweep's rung 0 runs 3,000, so the verdict line will say "not
  # comparable" — which is correct and is why the winner gets measured on the
  # federal-minutes benchmark afterwards, where v2 scored 7.65 %.
  model: qwen3vl-german-xix-v2
  value: 0.0533
  metric: cer
  measured_on: its own 10 % validation partition, 200-sample stratified draw
  draw_md5: e04ca483

notes: |
  METRIC. Run this with --metric cer. `benchmark_cer` cannot be filled by the
  sweep: BenchmarkSpec names one hf_repo plus one project, and this sweep's own
  validation partition is drawn across four corpora. The winner is measured on
  dh-unibe/image-text_federal-minutes-testset / TEST_federal_minutes afterwards,
  the way kraken-german-xix-v1 was (11.18 %) — that is the number comparable with
  v2's 7.65 % and qwen3.5-4b-v2's 6.80 %.

  NO NOISE FLOOR YET, and this sweep must not be read as a ranking until there
  is one. `noise_floor` is measured on a corpus and a budget and cannot exist
  before them (#115). Three learning rates an octave apart should separate well
  beyond any plausible floor — but "should" is the state, not the result, and
  the kraken side of this project has twice produced a confident ordering that
  the floor then swallowed. Measure it with

    scripts/measure_vlm_noise_floor.py config/sweeps/vlm-xix-effective-batch-01.yaml \
        --seeds 42 43 44 45 --write-to config/sweeps/vlm-xix-effective-batch-01.yaml

  — cell one, four seeds, at this budget, through the trainer — before trusting
  a gap, and BEFORE starting the sweep: the driver yields the card to any job it
  did not submit. (scripts/measure_noise_floor.py is the kraken measurement; it
  drives ketos itself and cannot run a VLM.)

  WHAT CELL ONE IS FOR. It reproduces v2's hyperparameters at this sweep's
  budget. If it lands far from v2's 0.0533 the sweep has a data or budget
  problem, not a hyperparameter finding — and that is worth knowing before the
  other two cells are read.
