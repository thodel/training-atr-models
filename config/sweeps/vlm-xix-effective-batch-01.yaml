budget:
  # IN SAMPLES, NOT STEPS (#138, 17.10.2026). The first run of this sweep gave
  # every cell 3,000 optimizer steps, and at equal steps the effective batch of
  # 64 sees four times the lines the batch of 16 sees: rung 0 came back 0.3010
  # (eff 16) / 0.1455 (eff 32) / cancelled (eff 64), and the order was the data
  # each cell had seen as much as its learning rate. The linear-scaling rule
  # this axis is built on predicts EQUAL results at equal samples, so equal
  # samples is what has to be held fixed:
  #
  #   rung 0   48,000 samples  →  3,000 / 1,500 / 750 steps   (~3 h each on an A40)
  #   rung 1  144,000 samples  →  9,000 / 4,500 / 2,250 steps (the survivor only)
  #
  # 48,000 is 3,000 steps at batch 16 — exactly what cell one's four noise-floor
  # seeds trained, so they ARE cell one at rung 0, and the floor (0.117) was
  # measured at this budget. Steps at the first attempt's budget, for the record:
  # state file vlm-xix-effective-batch-01.yaml.steps-budget.state.json on asteraix.
  #
  # `qwen3vl-german-xix-v2` trained one epoch over ~405k lines, ~25,000 steps at
  # batch 16. Rung 0 is an eighth of that: enough to separate rates if they
  # differ by more than the floor, far too little to call a model trained.
  samples: 48000
  rungs: [3, 1]
  # 3 × 48,000 + 1 × 144,000 = 288,000, plus one rung-0 cell lost to a preemption.
  max_total_samples: 336000

base:
  granularity: line
  load_in_4bit: false
  batch_size: 16
  accumulate_grad_batches: 1
  lrate: 2.0e-4
  lora_r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  gradient_checkpointing: true
  seed: 42
  workers: 4
  device: cuda:0

axes:
  # The coupled axis. Cell one IS `qwen3vl-german-xix-v2`'s setting, so the
  # baseline is measured here, at this budget, on this corpus — without it
  # "better" would be a comparison across sweeps, which the noise floor forbids.
  effective_batch:
    - {batch_size: 16, accumulate_grad_batches: 1, lrate: 2.0e-4}
    - {batch_size: 16, accumulate_grad_batches: 2, lrate: 4.0e-4}
    - {batch_size: 16, accumulate_grad_batches: 4, lrate: 8.0e-4}

baseline:
  # The number to beat, and the two fields that keep the leaderboard from
  # comparing across sets. 0.0533 is v2's own validation split at ~25,000 steps;
  # this sweep's rung 0 runs 3,000, so the verdict line will say "not
  # comparable" — which is correct and is why the winner gets measured on the
  # federal-minutes benchmark afterwards, where v2 scored 7.65 %.
  model: qwen3vl-german-xix-v2
  value: 0.0533
  metric: cer
  measured_on: its own 10 % validation partition, 200-sample stratified draw
  draw_md5: e04ca483

noise_floor:
