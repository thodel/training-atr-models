# The first Kraken sweep (#118, part of #111).
#
# Three axes, twelve cells, ordered by expected yield — not by convenience. Five
# axes of three values would be 243 configurations, which is not a sweep but a
# year, so the omissions below are the substance of this file.
#
# WHY THE HEIGHT IS HERE AND NOT LAST. #118 puts it last, "only if an axis is
# free". Two things in the code say otherwise:
#
#   * `KRAKEN_PLUS_SPEC`, the default every kraken run has used, is height 64 —
#     `kraken+` in ARCHITECTURE_SEARCH.md, and the shape behind the only
#     trustworthy German CER this project has (0.2131,
#     `kraken-medieval-german-v2`).
#   * `vgsl_geometry` puts that default at 1.968 frames per character, just
#     under its own warn threshold of 2.0. The geometry preflight has been
#     warning about the production configuration all along.
#
# So the baseline sits at the bottom of the one direction that held over both
# seeds of the first search (+0.19 from h48 to h256, knee at ~192). h64 is in
# this sweep as the CONTROL, not as a candidate: #111 asks for a configuration
# that beats `kraken-medieval-german-v2` "on the same measurement set", and
# without the baseline measured here, at this budget, on this corpus, "beats" is
# a comparison across sweeps — exactly what the noise floor forbids. It is also
# the cheapest of the three.
#
# WHAT IS DELIBERATELY ABSENT
#
#   LSTM width        — over both seeds: +0.0009 and +0.0006. Measured, and
#                       measured to do nothing.
#   h48               — 1.48 frames/char, below the warn threshold and 0.09
#                       under everything from h96 up, same order at both seeds.
#   h256              — 70 % more compute for +0.0021, and 0.7515 -> 0.5591 on a
#                       seed change. What sometimes trains to garbage is not a
#                       candidate, whatever its best run says.
#   h96               — dropped only to keep rung 0 at twelve. It is the first
#                       height to clear the warn threshold and belongs in sweep 2.
#   normalization     — NFD/NFC is a real question and a smaller one than the
#                       height; NFD stays fixed here (see notes.next).
#   batch_size        — linear scaling ties it to the learning rate, so the two
#                       are one axis, not two. Fixed at 256 with lrate on its own.
#   seed              — a sweep that varies the seed measures seed noise. Varying
#                       it is what #115 does, on one configuration, on purpose.
#
# THE DATA VERSION is the content key of these dataset specs under the current
# held-out registry (`artefact_cache.key_for_specs(datasets, "kraken")`). Every
# dataset names a `revision`, so it is `pinned` — it identifies the bytes and
# not a description of them, which matters here more than for a single run: an
# unpinned artefact expires after seven days and this ladder runs for longer.
# Reproduce it with:
#
#   python -c "import json;from atr_training.contracts import DatasetSpec;\
#   from atr_training.artefact_cache import key_for_specs;\
#   d=json.load(open('ubelix/specs/medieval-german-page-v1.json'))['datasets'];\
#   print(key_for_specs([DatasetSpec.model_validate(x) for x in d],'kraken').digest)"

