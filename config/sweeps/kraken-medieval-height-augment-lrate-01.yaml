budget:
  # Above the from-scratch convergence floor of 2,000 (convergence.py), so no
  # cell is refused for being too short to converge.
  steps: 4000
  rungs: [12, 4, 1]
  # 12x4,000 + 4x12,000 + 1x36,000 = 132,000, plus room for four preempted
  # rung-0 cells. A continuously running sweep without a ceiling is a leak (#117).
  max_total_steps: 150000

base:
  spec: "[256,64,0,1 Cr4,2,8,4,2 Cr4,2,32,1,1 Mp4,2,4,2 Cr3,3,64,1,1 Mp1,2,1,2 S1(1x0)1,3 Lbx256 Do0.5 Lbx256 Do0.5 Lbx256 Do0.5 Cr255,1,85,1,1]"
  augment: false
  lrate: 1.0e-4
  batch_size: 256
  accumulate_grad_batches: 1
  schedule: cosine
  quit: fixed
  normalization: NFD
  normalize_whitespace: true
  seed: 42
  weights_format: safetensors
  resize: fail
  workers: 8
  device: cuda:0

axes:
  # Height, as three whole VGSL specs — `ketos` takes the spec, not a height.
  spec:
    - "[256,64,0,1 Cr4,2,8,4,2 Cr4,2,32,1,1 Mp4,2,4,2 Cr3,3,64,1,1 Mp1,2,1,2 S1(1x0)1,3 Lbx256 Do0.5 Lbx256 Do0.5 Lbx256 Do0.5 Cr255,1,85,1,1]"
    - "[256,128,0,1 Cr4,2,8,4,2 Cr4,2,32,1,1 Mp4,2,4,2 Cr3,3,64,1,1 Mp1,2,1,2 S1(1x0)1,3 Lbx256 Do0.5 Lbx256 Do0.5 Lbx256 Do0.5 Cr255,1,85,1,1]"
    - "[256,192,0,1 Cr4,2,8,4,2 Cr4,2,32,1,1 Mp4,2,4,2 Cr3,3,64,1,1 Mp1,2,1,2 S1(1x0)1,3 Lbx256 Do0.5 Lbx256 Do0.5 Lbx256 Do0.5 Cr255,1,85,1,1]"
  # #118's top priority, and the one axis where an effect beyond the noise floor
  # is expected: Ströbel attributes his 1.6-point gap to pre-processing and
  # augmentation, and ARCHITECTURE_SEARCH.md records that the first search ran
  # `--no-augment` throughout. `false` is therefore the historical baseline,
  # although KrakenTrainParams has defaulted to True since before the move.
  augment: [false, true]
  # Unexplored, not settled. Until #96 kraken fed OneCycleLR a steps_per_epoch
  # in samples, so `--lrate` meant lrate/25 and "1e-3 learns, 1e-4 collapses"
  # was really 4e-5 against 4e-6. Two values, because the old finding survives
  # only as a hint that the order of magnitude is right.
  lrate: [1.0e-4, 3.0e-4]

baseline:
  # The number #111 asks every Kraken sweep to beat, and the only honest Kraken
  # CER this project has. `metric` and `measured_on` are not decoration: the
  # epic opens by holding this 0.2131 against the VLMs' 0.111 and 0.0680 and
  # saying the comparison is NOT established, because the sets differ. Without
  # those two fields the leaderboard would make that same mistake one level down.
  #
  # And it does differ here: this sweep ranks on `cer`, its own validation
  # partition, while 0.2131 is a `benchmark_cer` over 200 unseen documents. So
  # the verdict line will say "not comparable" — which is the right answer and
  # the reason the winner gets measured on german-medieval-v1 afterwards.
  model: kraken-medieval-german-v2
  value: 0.2131
  metric: benchmark_cer
  measured_on: german-medieval-v1
  chars: 882255
  errors: 188022

notes: |
  METRIC. Run this with --metric cer, not benchmark_cer.

  All twelve cells send the identical `datasets`, so they hit one entry of the
  artefact cache (its key covers the specs, the engine and the held-out
  fingerprint — none of which an axis here touches) and therefore share one
  compiled corpus and one validation partition. `cer` is comparable across the
  cells of THIS sweep for that reason, and for no other.

  It is not comparable with anything outside the sweep, and `benchmark_cer`
  cannot be filled here: `BenchmarkSpec` names an hf_repo plus a project, and
  german-medieval-v1 is drawn across all four corpora, so it is not one. The
  example in docs/EVAL_SETS.md leaves that field as an ellipsis for the same
  reason. The winner therefore gets measured on german-medieval-v1 afterwards,
  the way 0.2131 was — against 882,255 characters and 188,022 errors.

  PINNED. All four datasets name a `revision`, so key_for_specs(...).pinned is
  True and this digest identifies the bytes rather than a description of them.
  The four commit SHAs are copied from ubelix/specs/medieval-german-page-v1.json,
  where #135/#143 recorded them; a test compares the two files.

  This is not housekeeping. An unpinned artefact is reusable for seven days
  (artefact_cache.UNPINNED_MAX_AGE_DAYS) and then refuses and rebuilds — and a
  twelve-cell ladder runs for longer than that. Rung 1 would have been compared
  against a validation partition rebuilt between the rungs, which is #111's
  fourth lesson happening inside one sweep instead of between two.

  The digest changed when the revisions went in, which is correct and is why it
  had to happen before the first run rather than after it.

  NO NOISE FLOOR YET. `noise_floor` is absent on purpose: it is measured on a
  corpus and a budget and cannot exist before them (#115). Until it is there,
  every leaderboard gap is reported as a gap and none is known to be one. Measure
  it with scripts/measure_noise_floor.py --write-to this file.
